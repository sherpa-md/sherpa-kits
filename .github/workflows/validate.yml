name: Validate Sherpa Kits

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Validate catalog and kits
        run: ./validate.sh
